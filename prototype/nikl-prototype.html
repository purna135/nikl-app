<title>Nikl Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@600&family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a guide rail beside one phone frame; inside, a bold sticker-style app UI (ink outlines, hard offset shadows, poster-coloured cards). */
:root {
  --bg: #EEE9FF;
  --app: #FBFAFF;
  --surface: #FFFFFF;
  --surface-2: #F4F0FF;
  --ink: #1A1233;
  --muted: #615A7C;
  --line: #1A1233;
  --hair: #E3DCF6;
  --shadow: #1A1233;
  --pink: #FF3D7F;
  --sun: #FFC93C;
  --mint: #2ED3A0;
  --sky: #52B6FF;
  --tang: #FF7A2F;
  --grape: #B497FF;
  --accent: #FF3D7F;
  --accent-soft: #FFE0EA;
  --accent-ink: #1A1233;
  --soft: none;
  --on-accent: #1A1233;
  --sticker: #FFFFFF;
  --scrim: rgba(26, 18, 51, .45);
  --map-land: #EAF1EC;
  --map-road: #FFFFFF;
  --map-edge: #D6CFEA;
  --map-water: #A9DBFF;
  --map-park: #C3EED7;
  --map-label: #6E6790;
  --f-display: 'Bricolage Grotesque', 'Arial Rounded MT Bold', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0917; --app: #130E22; --surface: #1D1632; --surface-2: #261D42; --ink: #F4F0FF; --muted: #A79DC6;
    --line: #E6DFFF; --hair: #33295A; --shadow: #5B47AA; --sticker: #FFFFFF; --scrim: rgba(0,0,0,.6);
    --map-land: #1A1530; --map-road: #2D2552; --map-edge: #3A3168; --map-water: #1D4570; --map-park: #1D3D35; --map-label: #9389BB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0917; --app: #130E22; --surface: #1D1632; --surface-2: #261D42; --ink: #F4F0FF; --muted: #A79DC6;
  --line: #E6DFFF; --hair: #33295A; --shadow: #5B47AA; --sticker: #FFFFFF; --scrim: rgba(0,0,0,.6);
  --map-land: #1A1530; --map-road: #2D2552; --map-edge: #3A3168; --map-water: #1D4570; --map-park: #1D3D35; --map-label: #9389BB;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
input, select { font: inherit; color: var(--ink); }

/* ---------- stage + guide ---------- */
.stage { min-height: 100vh; display: flex; gap: 48px; justify-content: center; align-items: center;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.guide { width: 290px; display: flex; flex-direction: column; gap: 14px; }
.wordmark { font: 800 26px/1 var(--f-display); letter-spacing: -0.04em; display: inline-flex; align-items: center; gap: 2px; }
.wordmark::after { content: ""; width: .32em; height: .32em; border-radius: 50%; background: var(--accent); border: 2px solid var(--line); margin-left: 3px; transform: translateY(.2em); }
.wordmark.lg { font-size: 54px; }
.wordmark.xl { font-size: 72px; }
.g-lead { margin: 0; font-size: 16px; color: var(--ink); text-wrap: pretty; }
.g-label { font: 700 12px/1 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 6px; }
.g-list { display: flex; flex-direction: column; gap: 6px; }
.g-list button { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 600; box-shadow: 2px 2px 0 var(--shadow); }
.g-list button span { font: 600 12px var(--f-mono); color: var(--muted); width: 18px; }
.g-list button.on { background: var(--sun); color: var(--on-accent); }
.g-list button.on span { color: var(--on-accent); }
.g-note { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

/* ---------- phone ---------- */
.phone { width: 390px; height: min(844px, calc(100vh - 48px)); min-height: 640px; flex: none; position: relative;
  border: 3px solid var(--line); border-radius: 46px; box-shadow: 8px 8px 0 var(--shadow); overflow: hidden; background: var(--app); }
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--app); }
.statusbar { flex: none; height: 38px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font: 700 14px var(--f-body); }
.sb-r { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.batt { width: 22px; height: 11px; border: 2px solid var(--ink); border-radius: 3px; position: relative; }
.batt::after { content: ""; position: absolute; inset: 1px 5px 1px 1px; background: var(--ink); border-radius: 1px; }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.view.v-map { overflow: hidden; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--line); background: var(--surface); padding: 8px 6px 16px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font: 700 11px var(--f-body); color: var(--muted); background: none; border: 0; padding: 0; position: relative; }
.tab-ic { display: grid; place-items: center; padding: 3px 16px; border: 2px solid transparent; border-radius: 12px; }
.tab.on { color: var(--ink); }
.tab.on .tab-ic { background: var(--sun); border-color: var(--line); color: var(--on-accent); }
.tab .badge { position: absolute; top: -2px; left: calc(50% + 10px); background: var(--accent); color: var(--on-accent); border: 2px solid var(--line); border-radius: 999px; font-size: 10px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; }

/* ---------- shared bits ---------- */
.pad { padding-left: 18px; padding-right: 18px; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.fine { font-size: 12px; color: var(--muted); margin: 10px 0 0; text-align: center; }
.eyebrow { font: 700 12px/1 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.h1 { font: 800 30px/1.02 var(--f-display); letter-spacing: -0.03em; margin: 8px 0 0; text-wrap: balance; }
.h2 { font: 800 22px/1.1 var(--f-display); letter-spacing: -0.02em; margin: 0; }
.hdr { position: sticky; top: 0; z-index: 6; background: var(--app); display: flex; align-items: center; gap: 10px; padding: 8px 18px 10px; }
.h-title { font: 800 26px/1 var(--f-display); letter-spacing: -0.03em; margin: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--surface); position: relative; flex: none; }
.icon-btn.dot::after { content: ""; position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 700 15px/1 var(--f-body); border: 2px solid var(--line); border-radius: 14px; padding: 13px 16px; background: var(--surface); color: var(--ink); box-shadow: 3px 3px 0 var(--shadow); transition: transform .08s, box-shadow .08s; white-space: nowrap; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.btn:disabled { opacity: .55; box-shadow: none; }
.btn-primary { background: var(--pink); color: var(--on-accent); }
.btn-sun { background: var(--sun); color: var(--on-accent); }
.btn-mint { background: var(--mint); color: var(--on-accent); }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 11px; box-shadow: 2px 2px 0 var(--shadow); }
.btn.block { width: 100%; }
.btn.ghost { box-shadow: none; background: transparent; }
.link { background: none; border: 0; padding: 0; font: 700 13px var(--f-body); color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); border-radius: 999px; padding: 7px 13px; font: 600 13px/1 var(--f-body); background: var(--surface); white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--app); }
.chip.big { padding: 10px 14px; font-size: 14px; }
.chip-cloud { display: flex; flex-wrap: wrap; gap: 8px; }
.rail { display: flex; gap: 14px; overflow-x: auto; padding: 4px 18px 12px; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-padding-left: 18px; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; flex: none; }
.chips-rail { gap: 8px; padding-bottom: 6px; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; box-shadow: 4px 4px 0 var(--shadow); }
.sec { margin-top: 26px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 0 18px; margin-bottom: 10px; }
.sec-h h2 { font: 800 21px/1.1 var(--f-display); letter-spacing: -0.02em; margin: 0; }
.sticker { display: inline-block; background: var(--sun); color: var(--on-accent); border: 2px solid var(--line); border-radius: 10px; padding: 5px 10px; font: 700 13px var(--f-body); transform: rotate(-3deg); box-shadow: 2px 2px 0 var(--shadow); }
.tag { display: inline-flex; align-items: center; gap: 5px; font: 700 12px/1 var(--f-body); padding: 6px 10px; border-radius: 999px; border: 2px solid var(--line); background: var(--c, var(--surface)); color: var(--on-accent); }
.tag.plain { background: var(--surface); color: var(--ink); border-color: var(--hair); }

/* avatars */
.avs { display: flex; align-items: center; }
.av { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: var(--c); color: var(--on-accent); font: 700 10px/1 var(--f-body); display: grid; place-items: center; flex: none; }
.avs .av + .av { margin-left: -8px; }
.av.lg { width: 40px; height: 40px; font-size: 14px; }
.av.xl { width: 72px; height: 72px; font-size: 24px; box-shadow: 3px 3px 0 var(--shadow); }
.av.more { background: var(--surface-2); color: var(--ink); }
.club-av { border-radius: 30%; }

/* posters */
.poster { position: relative; background-color: var(--pc); overflow: hidden; display: flex; align-items: flex-end; padding: 12px 14px; }
.poster-title { position: relative; font: 800 27px/.9 var(--f-display); color: var(--on-accent); letter-spacing: -0.03em; text-transform: uppercase; max-width: 78%; text-wrap: balance; }
.poster-emoji { position: absolute; top: 12px; right: 12px; width: 50px; height: 50px; display: grid; place-items: center; font-size: 26px; background: var(--sticker); border: 2px solid var(--on-accent); border-radius: 50%; transform: rotate(-10deg); }
.pat-dots { background-image: radial-gradient(color-mix(in srgb, var(--on-accent) 22%, transparent) 2px, transparent 2.6px); background-size: 15px 15px; }
.pat-stripes { background-image: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--on-accent) 13%, transparent) 0 9px, transparent 9px 21px); }
.pat-rings { background-image: repeating-radial-gradient(circle at 88% 18%, transparent 0 13px, color-mix(in srgb, var(--on-accent) 15%, transparent) 13px 16px); }
.pat-grid { background-image: linear-gradient(color-mix(in srgb, var(--on-accent) 15%, transparent) 2px, transparent 2px), linear-gradient(90deg, color-mix(in srgb, var(--on-accent) 15%, transparent) 2px, transparent 2px); background-size: 22px 22px; }
.poster.mini { width: 72px; height: 72px; flex: none; border: 2px solid var(--line); border-radius: 16px; padding: 0; justify-content: center; align-items: center; }
.poster.mini .poster-emoji { position: static; width: 40px; height: 40px; font-size: 21px; }
.poster.mini .poster-title { display: none; }
.poster.tiny { width: 54px; height: 54px; border-radius: 14px; }
.poster.tiny .poster-emoji { width: 32px; height: 32px; font-size: 17px; }

/* event cards */
.ecard { width: 252px; position: relative; text-align: left; padding: 0; overflow: hidden; cursor: pointer; }
.ecard .poster { height: 150px; border-bottom: 2px solid var(--line); }
.ecard-body { padding: 11px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
.ecard-when { font: 700 12px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.ecard h3 { font: 800 18px/1.12 var(--f-display); letter-spacing: -0.02em; margin: 0; }
.ecard-meta { font-size: 13px; color: var(--muted); }
.ecard-meta b { color: var(--ink); }
.going-line { display: flex; align-items: center; gap: 8px; font: 600 12px var(--f-body); margin-top: 4px; }
.save-btn { position: absolute; top: 112px; right: 12px; width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); display: grid; place-items: center; z-index: 1; }
.save-btn.on, .round.saved { background: var(--pink); color: var(--on-accent); }
.save-btn.on svg, .round.saved svg { fill: currentColor; }
.live-pill { position: absolute; top: 12px; left: 12px; z-index: 1; display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--app); font: 800 11px/1 var(--f-body); letter-spacing: .08em; padding: 6px 9px; border-radius: 999px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: ping 1.6s infinite; flex: none; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
.row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1.5px solid var(--hair); width: 100%; text-align: left; background: none; border-top: 0; border-left: 0; border-right: 0; }
.row:last-child { border-bottom: 0; }
.row-txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.row-txt b { font: 800 16px/1.15 var(--f-display); letter-spacing: -0.01em; }
.row-when { font: 700 11.5px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.row-meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.price { font-weight: 700; color: var(--ink); }
.price.free { color: var(--on-accent); background: var(--mint); padding: 1px 7px; border-radius: 6px; border: 1.5px solid var(--line); font-size: 12px; }

/* ---------- onboarding ---------- */
.ob { padding: 6px 22px 0; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
.ob-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ob-h { font: 800 34px/1 var(--f-display); letter-spacing: -0.035em; margin: 6px 0 0; text-wrap: balance; }
.ob-h em { font-style: normal; background: var(--pink); color: var(--on-accent); padding: 0 6px; border-radius: 8px; border: 2px solid var(--line); display: inline-block; transform: rotate(-1.5deg); }
.ob-p { margin: 0; color: var(--muted); }
.ob-label { font: 700 14px var(--f-body); margin-top: 6px; }
.ob-foot { position: sticky; bottom: 0; margin: auto -22px 0; padding: 14px 22px 16px; background: linear-gradient(transparent, var(--app) 28%); }
.ghost-link { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; background: none; border: 0; padding: 0; font: 700 14px var(--f-body); text-decoration: underline; text-decoration-color: var(--sky); text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* ---------- home ---------- */
.area-pill { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border: 2px solid var(--line); border-radius: 999px; padding: 6px 10px; font: 700 13px var(--f-body); }
.hello { padding: 4px 18px 12px; }
.live-strip { margin: 4px 18px 0; width: calc(100% - 36px); display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--app); border: 0; border-radius: 14px; padding: 11px 14px; font: 500 13px var(--f-body); text-align: left; }
.live-strip span.t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.friends-card { margin-top: 14px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-align: left; background: var(--sky); color: var(--on-accent); }
.friends-card .fc-t { font: 800 16px/1.15 var(--f-display); }
.friends-card .fc-s { font-size: 13px; }
.fc-cta { margin-left: auto; flex: none; background: var(--sticker); color: var(--on-accent); border: 2px solid var(--on-accent); border-radius: 10px; padding: 6px 9px; font: 700 12px var(--f-body); }
.cat-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); gap: 10px; overflow-x: auto; padding: 4px 18px 12px; scrollbar-width: none; }
.cat-grid::-webkit-scrollbar { display: none; }
.cat-tile { width: 108px; height: 82px; background: var(--c); color: var(--on-accent); border: 2px solid var(--line); border-radius: 18px; padding: 9px 11px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; font: 700 13px/1.1 var(--f-body); box-shadow: 2px 2px 0 var(--shadow); }
.cat-tile .e { font-size: 24px; line-height: 1; }
.squad-banner { margin-top: 26px; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px; background: var(--sun); color: var(--on-accent); }
.squad-banner b { font: 800 17px/1.1 var(--f-display); display: block; }
.squad-banner span { font-size: 13px; }
.club-card { width: 158px; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.club-card .av { width: 58px; height: 58px; font-size: 18px; }
.club-card b { font: 800 15px/1.15 var(--f-display); }
.club-card span { font-size: 12px; color: var(--muted); }
.end-note { text-align: center; color: var(--muted); font-size: 13px; padding: 26px 30px 30px; }

/* ---------- explore ---------- */
.search { flex: 1; display: flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); padding: 0 12px; height: 44px; }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 15px; }
.ex-count { font: 700 13px var(--f-body); color: var(--muted); margin: 8px 0 2px; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty b { font: 800 20px var(--f-display); color: var(--ink); }

/* ---------- map ---------- */
.mapwrap { position: absolute; inset: 0; }
svg.map { width: 100%; height: 100%; display: block; }
.m-land { fill: var(--map-land); }
.m-water { stroke: var(--map-water); fill: none; stroke-linecap: round; }
.m-lake { fill: var(--map-water); }
.m-park { fill: var(--map-park); }
.m-edge { stroke: var(--map-edge); fill: none; stroke-width: 12; stroke-linecap: round; }
.m-road { stroke: var(--map-road); fill: none; stroke-width: 8; stroke-linecap: round; }
.m-label { fill: var(--map-label); font: 800 9.5px var(--f-body); letter-spacing: .14em; }
.m-label.it { font: italic 600 10px var(--f-body); letter-spacing: 0; }
.pin { cursor: pointer; }
.pin .body { stroke: var(--line); stroke-width: 2.5; }
.pin .pulse { fill: var(--accent); opacity: .45; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
.pin.sel .body { stroke-width: 3.5; }
.pin-tag { fill: var(--ink); }
.pin-tag-t { fill: var(--app); font: 700 10px var(--f-body); }
.me .pulse { fill: var(--sky); opacity: .35; transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.6); opacity: .55; } 100% { transform: scale(1.7); opacity: 0; } }
.map-top { position: absolute; top: 6px; left: 14px; right: 14px; display: flex; flex-direction: column; gap: 10px; z-index: 3; }
.map-search { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 15px; box-shadow: 3px 3px 0 var(--shadow); font: 500 15px var(--f-body); color: var(--muted); text-align: left; }
.map-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.map-chips .chip { box-shadow: 2px 2px 0 var(--shadow); }
.map-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--surface); border-top: 2px solid var(--line); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; max-height: 76%; }
.map-sheet.open { height: 76%; }
.sheet-handle { background: none; border: 0; padding: 9px 0 4px; display: grid; place-items: center; width: 100%; flex: none; }
.sheet-handle span { width: 44px; height: 5px; border-radius: 99px; background: var(--hair); }
.ms-h { padding: 2px 18px 10px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; flex: none; }
.ms-list { overflow-y: auto; flex: 1; }
.mcard { width: 232px; display: flex; gap: 10px; align-items: center; padding: 8px; text-align: left; border-radius: 16px; box-shadow: 2px 2px 0 var(--shadow); }
.mcard b { font: 800 14.5px/1.15 var(--f-display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mcard span { font-size: 12px; color: var(--muted); }
.mini-sel { margin: 0 18px 12px; padding: 10px; display: flex; gap: 12px; align-items: center; border-radius: 18px; background: var(--surface-2); }
.mini-sel .row-txt b { font-size: 16px; }

/* ---------- event detail ---------- */
.hero { position: relative; }
.hero .poster { height: 290px; border-bottom: 2px solid var(--line); padding: 18px; }
.hero .poster-title { font-size: 46px; max-width: 85%; }
.hero .poster-emoji { top: 64px; right: 20px; width: 70px; height: 70px; font-size: 36px; }
.hero .live-pill { top: auto; bottom: 16px; left: auto; right: 16px; }
.fab-row { position: absolute; top: 10px; left: 14px; right: 14px; display: flex; gap: 8px; z-index: 2; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; box-shadow: 2px 2px 0 var(--shadow); flex: none; }
.detail { padding-top: 16px; padding-bottom: 20px; }
.d-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.d-title { font: 800 30px/1.02 var(--f-display); letter-spacing: -0.03em; margin: 12px 0 14px; text-wrap: balance; }
.org-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1.5px solid var(--hair); border-bottom: 1.5px solid var(--hair); }
.org-link { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; flex: 1; min-width: 0; }
.org-name { font: 800 16px/1.15 var(--f-display); display: flex; align-items: center; gap: 5px; }
.verified { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--sky); color: var(--on-accent); border: 1.5px solid var(--line); flex: none; }
.facts { display: flex; flex-direction: column; gap: 14px; margin: 16px 0 4px; }
.fact { display: flex; gap: 12px; align-items: center; }
.fact > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fact > div b { font-weight: 700; }
.fact > div span { font-size: 13px; color: var(--muted); }
.icbox { width: 42px; height: 42px; border-radius: 13px; border: 2px solid var(--line); background: var(--surface-2); display: grid; place-items: center; flex: none; }
.d-sec { margin-top: 22px; }
.d-sec h3 { font: 800 18px var(--f-display); margin: 0 0 10px; letter-spacing: -0.01em; }
.d-sec p { margin: 0; }
.going { display: flex; align-items: center; gap: 12px; }
.going > div { display: flex; flex-direction: column; }
.solo-note { margin-top: 12px; background: var(--surface-2); border: 2px dashed var(--hair); border-radius: 14px; padding: 10px 12px; font-size: 13px; }
.gtk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.gtk li { display: flex; gap: 8px; align-items: flex-start; }
.gtk svg { flex: none; margin-top: 3px; color: var(--mint); }
.qa { background: var(--surface-2); border-radius: 14px; padding: 12px; font-size: 14px; }
.qa-a { margin-top: 8px; padding-left: 12px; border-left: 3px solid var(--accent); }
.cta-bar { position: sticky; bottom: 0; z-index: 5; background: var(--surface); border-top: 2px solid var(--line); padding: 12px 16px 14px; display: flex; gap: 8px; align-items: center; }
.cta-price { display: flex; flex-direction: column; margin-right: auto; }
.cta-price b { font: 800 21px/1 var(--f-display); }
.cta-price span { font-size: 12px; color: var(--muted); }

/* ---------- sheets ---------- */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; }
.sheet-bg { position: absolute; inset: 0; background: var(--scrim); border: 0; padding: 0; }
.sheet { position: relative; width: 100%; background: var(--surface); border-top: 2px solid var(--line); border-radius: 26px 26px 0 0; padding: 8px 18px 20px; max-height: 88%; overflow-y: auto; animation: up .26s cubic-bezier(.2,.9,.3,1.1); }
@keyframes up { from { transform: translateY(40%); opacity: .3; } to { transform: none; opacity: 1; } }
.sheet-top { display: flex; align-items: center; gap: 10px; margin: 6px 0 14px; }
.sheet-top h2 { font: 800 21px/1.1 var(--f-display); margin: 0; flex: 1; letter-spacing: -0.02em; }
.tier { display: flex; align-items: center; gap: 12px; border: 2px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
.tier.out { opacity: .5; border-style: dashed; }
.tier > div:first-child { flex: 1; }
.tier b { display: block; font: 800 16px var(--f-display); }
.tier span { font-size: 12.5px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface-2); font: 700 18px/1 var(--f-body); display: grid; place-items: center; }
.stepper output { font: 700 16px var(--f-body); min-width: 14px; text-align: center; font-variant-numeric: tabular-nums; }
.sum { border-top: 2px dashed var(--hair); margin-top: 6px; padding-top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.sum div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.sum .tot { font: 800 18px var(--f-display); }
.check { display: flex; gap: 10px; align-items: center; margin: 14px 0; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.upi-list { display: flex; flex-direction: column; gap: 8px; }
.upi { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 2px solid var(--line); border-radius: 15px; background: var(--surface); text-align: left; font: 700 15px var(--f-body); }
.upi .logo { width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--c); color: var(--on-accent); font: 800 14px var(--f-display); }
.upi .grow + svg { color: var(--muted); }
.upi-alt { background: var(--surface-2); border-style: dashed; }
.waiting { text-align: center; padding: 26px 8px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.spinner { width: 64px; height: 64px; border-radius: 50%; border: 6px solid var(--hair); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.secure { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--muted); margin-top: 14px; }

/* ---------- tickets ---------- */
.success { padding: 10px 18px 24px; display: flex; flex-direction: column; gap: 16px; }
.ticket { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; box-shadow: 5px 5px 0 var(--shadow); overflow: hidden; }
.t-top { padding: 16px; border-bottom: 0; }
.t-top .eyebrow { color: var(--on-accent); opacity: .8; }
.t-top h3 { font: 800 24px/1 var(--f-display); letter-spacing: -0.02em; margin: 6px 0 0; color: var(--on-accent); text-transform: uppercase; }
.t-perf { height: 0; border-top: 2.5px dashed var(--line); position: relative; }
.t-perf::before, .t-perf::after { content: ""; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--app); border: 2px solid var(--line); }
.t-perf::before { left: -14px; }
.t-perf::after { right: -14px; }
.t-body { display: flex; gap: 14px; padding: 16px; align-items: center; }
.qr { width: 132px; height: 132px; flex: none; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: #FFFFFF; padding: 6px; }
.qr svg { width: 100%; height: 100%; display: block; }
.t-info { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.t-info span { display: block; font: 700 11px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.t-info b { font-size: 15px; }
.mono { font-family: var(--f-mono); letter-spacing: .03em; }
.t-venue { display: flex; gap: 6px; align-items: center; padding: 0 16px 16px; font-size: 13px; color: var(--muted); }
.seg { display: flex; background: var(--surface-2); border: 2px solid var(--line); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 8px; font: 700 14px var(--f-body); color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 2px var(--line); }
.tix-row { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px; margin-top: 12px; }
.tix-row .row-txt b { font-size: 16px; }
.tix-stub { margin-left: auto; flex: none; border-left: 2px dashed var(--hair); padding-left: 12px; text-align: center; font: 700 11px var(--f-body); color: var(--muted); }
.tix-stub b { display: block; font: 800 20px var(--f-display); color: var(--ink); }

/* ---------- club ---------- */
.club-cover { height: 150px; position: relative; background-color: var(--pc); border-bottom: 2px solid var(--line); }
.club-head { margin-top: -46px; position: relative; display: flex; flex-direction: column; gap: 6px; }
.club-head .av { width: 88px; height: 88px; font-size: 28px; box-shadow: 4px 4px 0 var(--shadow); }
.club-head .h1 { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.stats { display: flex; gap: 0; margin: 10px 0 4px; border: 2px solid var(--line); border-radius: 16px; overflow: hidden; }
.stats > div { flex: 1; padding: 10px 6px; text-align: center; display: flex; flex-direction: column; }
.stats > div + div { border-left: 2px solid var(--line); }
.stats b { font: 800 19px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11.5px; color: var(--muted); }
.club-btns { display: flex; gap: 10px; margin-top: 8px; }
.pass { display: flex; align-items: center; gap: 12px; padding: 14px; margin-top: 14px; background: var(--mint); color: var(--on-accent); }
.pass .pass-l { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.pass .eyebrow { color: var(--on-accent); opacity: .75; }
.pass b { font: 800 17px var(--f-display); }
.pass span { font-size: 12.5px; }
.posts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; }
.post { aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 2px solid var(--line); background-color: var(--pc); position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 6px; }
.post span { position: relative; font: 700 11px/1.15 var(--f-body); color: var(--on-accent); background: var(--sticker); border-radius: 6px; padding: 3px 5px; }

/* ---------- squad ---------- */
.squad-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
.poll-opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px; margin-bottom: 10px; border-radius: 18px; position: relative; overflow: hidden; }
.poll-opt.mine { background: var(--sun); color: var(--on-accent); }
.poll-opt.mine .muted { color: var(--on-accent); }
.poll-opt .row-txt { position: relative; }
.votebar { height: 8px; border-radius: 99px; background: var(--hair); overflow: hidden; margin-top: 6px; border: 1.5px solid var(--line); }
.votebar i { display: block; height: 100%; background: var(--accent); }
.poll-opt .avs { margin-top: 6px; }
.split-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1.5px solid var(--hair); }
.split-row:last-child { border-bottom: 0; }
.status { font: 700 12px/1 var(--f-body); padding: 6px 9px; border-radius: 999px; border: 2px solid var(--line); }
.status.paid { background: var(--mint); color: var(--on-accent); }
.status.pending { background: var(--surface-2); }
.timer { display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--app); padding: 10px 12px; border-radius: 14px; font: 600 13px var(--f-body); margin: 14px 0; }

/* ---------- profile ---------- */
.prof-top { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.badges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.badge-c { border: 2px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px; background: var(--c); color: var(--on-accent); }
.badge-c.locked { background: var(--surface-2); color: var(--ink); border-style: dashed; }
.badge-c .e { font-size: 24px; }
.badge-c b { font: 800 15px var(--f-display); }
.badge-c span { font-size: 12px; }
.prog { height: 6px; border-radius: 99px; background: var(--hair); overflow: hidden; margin-top: 4px; }
.prog i { display: block; height: 100%; background: var(--sky); }
.menu { display: flex; flex-direction: column; margin-top: 22px; border: 2px solid var(--line); border-radius: 18px; overflow: hidden; margin-bottom: 26px; }
.menu button { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--surface); border: 0; text-align: left; font: 600 15px var(--f-body); }
.menu button + button { border-top: 1.5px solid var(--hair); }
.menu .m-sub { margin-left: auto; color: var(--muted); font-size: 13px; font-weight: 500; }
.menu .org-switch { background: var(--ink); color: var(--app); }
.menu .org-switch .m-sub { color: var(--app); opacity: .7; }

/* ---------- organizer ---------- */
.org-banner { background: var(--ink); color: var(--app); font: 700 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; text-align: center; padding: 6px; }
.club-switch { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; font: 800 17px var(--f-display); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.tile { border: 2px solid var(--line); border-radius: 18px; padding: 12px; background: var(--c); color: var(--on-accent); display: flex; flex-direction: column; gap: 2px; }
.tile span { font: 700 12px var(--f-body); }
.tile b { font: 800 26px/1.05 var(--f-display); font-variant-numeric: tabular-nums; }
.tile em { font-style: normal; font-size: 12px; }
.tile.wide { grid-column: span 2; flex-direction: row; align-items: center; justify-content: space-between; }
.actions3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; margin-top: 14px; }
.actions3 .btn { padding: 12px 8px; font-size: 13.5px; }
.oe { padding: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.oe-top { display: flex; gap: 12px; align-items: center; }
.fill { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1.5px solid var(--line); overflow: hidden; }
.fill i { display: block; height: 100%; background: var(--mint); }
.oe-meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.new-tag { font: 800 10.5px var(--f-body); letter-spacing: .06em; text-transform: uppercase; background: var(--pink); color: var(--on-accent); border: 1.5px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.funnel { display: flex; flex-direction: column; gap: 10px; }
.funnel > div { display: grid; grid-template-columns: 82px 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.funnel .bar { height: 14px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.funnel .bar i { display: block; height: 100%; background: var(--grape); border-radius: 6px; }
.funnel b { text-align: right; font-variant-numeric: tabular-nums; }
.drop { margin-top: 16px; border: 2.5px dashed var(--line); border-radius: 22px; padding: 28px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; background: var(--surface-2); }
.drop .icbox { width: 58px; height: 58px; background: var(--sun); color: var(--on-accent); border-radius: 18px; }
.drop b { font: 800 20px var(--f-display); }
.drop p { margin: 0; font-size: 14px; color: var(--muted); }
.reading { margin-top: 16px; position: relative; border: 2px solid var(--line); border-radius: 20px; overflow: hidden; }
.reading .poster { height: 300px; }
.reading .poster-title { font-size: 40px; }
.reading .scan { position: absolute; left: 0; right: 0; height: 60px; background: linear-gradient(transparent, color-mix(in srgb, var(--sky) 55%, transparent), transparent); animation: scan 1.4s ease-in-out infinite alternate; }
@keyframes scan { from { top: -10px; } to { top: 250px; } }
.reading-label { position: absolute; bottom: 12px; left: 12px; right: 12px; background: var(--ink); color: var(--app); border-radius: 12px; padding: 10px 12px; font: 700 13px var(--f-body); display: flex; align-items: center; gap: 8px; }
.ai-note { margin-top: 14px; display: flex; gap: 10px; align-items: center; background: var(--sun); color: var(--on-accent); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; font: 600 13px var(--f-body); }
.form { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font: 700 13px var(--f-body); display: flex; align-items: center; gap: 6px; }
.field .ai { font: 700 10.5px var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--on-accent); background: var(--sun); border: 1.5px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.field input, .field select { height: 46px; border: 2px solid var(--line); border-radius: 13px; background: var(--surface); padding: 0 12px; font-size: 15px; width: 100%; min-width: 0; }
.field.filled input, .field.filled select { background: color-mix(in srgb, var(--sun) 16%, var(--surface)); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle-row { display: flex; align-items: center; gap: 12px; border: 2px solid var(--line); border-radius: 14px; padding: 12px; }
.toggle-row > div { flex: 1; display: flex; flex-direction: column; }
.toggle-row span { font-size: 12.5px; color: var(--muted); }
.switch { appearance: none; width: 48px; height: 28px; border-radius: 99px; background: var(--hair); border: 2px solid var(--line); position: relative; cursor: pointer; flex: none; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); transition: left .15s; box-sizing: border-box; }
.switch:checked { background: var(--mint); }
.switch:checked::after { left: 22px; }

/* ---------- toast + confetti ---------- */
.toast { position: absolute; left: 14px; right: 14px; bottom: 92px; z-index: 30; background: var(--ink); color: var(--app); border-radius: 14px; padding: 12px 14px; font: 600 13.5px/1.35 var(--f-body); box-shadow: 3px 3px 0 var(--accent); animation: up .2s ease-out; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 25; }
.confetti i { position: absolute; top: -16px; width: 9px; height: 15px; border-radius: 2px; border: 1.5px solid var(--line); animation: fall var(--d) cubic-bezier(.3,.6,.6,1) forwards; }
@keyframes fall { to { transform: translate(var(--x), 900px) rotate(var(--r)); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ---------- style switcher (guide) ---------- */
.style-switch { display: flex; gap: 4px; padding: 4px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); }
.style-switch button { flex: 1; border: 0; border-radius: 10px; padding: 9px 8px; background: none; font: 700 13.5px var(--f-body); color: var(--muted); }
.style-switch button[aria-checked="true"] { background: var(--ink); color: var(--app); }
.g-style-note { margin: 0; font-size: 13px; color: var(--muted); }

/* ================= CLEAN & MINIMAL STYLE =================
   Layout: same screens and flows; hairline borders, soft elevation, pastel imagery,
   one emerald accent, ink-black primary actions, Inter Tight + Inter. */
:root[data-style="minimal"] {
  --bg: #F1F2F4; --app: #FFFFFF; --surface: #FFFFFF; --surface-2: #F5F6F8; --ink: #121417; --muted: #686E79;
  --line: #E3E5EA; --hair: #EDEFF2; --shadow: transparent;
  --accent: #0E9F6E; --accent-soft: #E3F5EE; --accent-ink: #0A6B4B;
  --pink: #FBE3EA; --sun: #FAF0D3; --mint: #DCF2E8; --sky: #DEEBFA; --tang: #FCE8DA; --grape: #ECE6FB;
  --on-accent: #121417; --sticker: #FFFFFF; --scrim: rgba(18, 20, 23, .35);
  --soft: 0 1px 2px rgba(18, 20, 23, .05), 0 6px 20px rgba(18, 20, 23, .07);
  --map-land: #F1F3F1; --map-road: #FFFFFF; --map-edge: #E2E5E8; --map-water: #D4E8F8; --map-park: #DCF0E3; --map-label: #8A909A;
  --f-display: 'Inter Tight', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root[data-style="minimal"]:not([data-theme="light"]) {
    --bg: #0A0B0D; --app: #121417; --surface: #181B1F; --surface-2: #1F2328; --ink: #F1F2F4; --muted: #9AA0AA;
    --line: #2A2F36; --hair: #23272D; --accent: #34D399; --accent-soft: #123428; --accent-ink: #6EE7B7;
    --pink: #3A2530; --sun: #3A3220; --mint: #1B3A2D; --sky: #1E2F44; --tang: #3D2A1E; --grape: #2C2643;
    --on-accent: #F1F2F4; --sticker: #262A30; --scrim: rgba(0, 0, 0, .6);
    --soft: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    --map-land: #15181B; --map-road: #23272D; --map-edge: #2A2F36; --map-water: #1B3348; --map-park: #19302A; --map-label: #7B828C;
    color-scheme: dark;
  }
}

function qr(seed) {
  const n = 25; let s = 7;
  for (const ch of seed) s = (Math.imul(s, 31) + ch.charCodeAt(0)) >>> 0;
  s = s || 1;
  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const inF = (x, y) => [[0, 0], [n - 7, 0], [0, n - 7]].some(([fx, fy]) => x >= fx - 1 && x < fx + 8 && y >= fy - 1 && y < fy + 8);
  let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { if (inF(x, y)) continue; if (rnd() < .48) d += `M${x} ${y}h1v1h-1z`; }
  const f = (x, y) => `M${x} ${y}h7v7h-7zM${x + 1} ${y + 1}v5h5v-5zM${x + 2} ${y + 2}h3v3h-3z`;
  return `<svg viewBox="0 0 ${n} ${n}" role="img" aria-label="Ticket QR code" shape-rendering="crispEdges"><path d="${d}" fill="#1A1233"/><path d="${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}" fill="#1A1233" fill-rule="evenodd"/></svg>`;
}
const code = () => 'NKL-' + Array.from({ length: 4 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 31)]).join('');

  let h = '';

  $('#confetti').innerHTML = h;

}

  const ai = st === 'filled';
  const f = (lbl, inner) => `<div class="field ${ai ? 'filled' : ''}"><label>${lbl}${ai ? ' <span class="ai">From poster</span>' : ''}</label>${inner}</div>`;
  return head + `<div class="pad" style="padding-bottom:28px">
    ${ai ? `<div class="ai-note">${ic('spark', 20)} Filled 6 fields from your poster. Check them and publish.</div>` : ''}
    <div class="form">
      ${f('Event name', `<input id="f-title" value="${ai ? 'Sunday Long Run: 10K' : ''}" placeholder="e.g. Sunday Long Run">`)}
      <div class="field"><label>Category</label><select id="f-cat">${CATS.map(c => `<option value="${c.id}" ${c.id === 'fitness' ? 'selected' : ''}>${c.emoji} ${c.name}</option>`).join('')}</select></div>
      <div class="two">${f('Date', `<input id="f-date" type="date" value="${ai ? '2026-11-29' : ''}">`)}${f('Start time', `<input id="f-time" type="time" value="${ai ? '05:45' : ''}">`)}</div>
      ${f('Venue', `<input id="f-venue" value="${ai ? 'Infocity Square, Patia' : ''}" placeholder="Search a place or drop a pin">`)}
      <div class="two">${f('Price (₹)', `<input id="f-price" type="number" min="0" inputmode="numeric" value="${ai ? '0' : ''}" placeholder="0 for free">`)}${f('Capacity', `<input id="f-cap" type="number" min="1" inputmode="numeric" value="${ai ? '120' : ''}" placeholder="No limit">`)}</div>
      <div class="toggle-row"><div><b>Repeats every Sunday</b><span>Creates the next 8 Sundays. Edit any date later.</span></div><input type="checkbox" class="switch" id="f-rep" ${ai ? 'checked' : ''} aria-label="Repeats every Sunday"></div>
      <div class="toggle-row"><div><b>Notify my 2,140 followers</b><span>They get a push and see it at the top of their feed.</span></div><input type="checkbox" class="switch" id="f-notify" checked aria-label="Notify followers"></div>
      <button class="btn btn-primary block" data-act="publish">Publish event</button>
      <p class="fine" style="margin-top:0">Free events cost nothing. Paid events: 4% booking fee, paid out to your bank daily.</p>
    </div></div>`;
};

/* ================= BOOKING SHEET ================= */
const tiersOf = e => e.tiers || [{ n: e.price ? 'Regular' : 'Free RSVP', p: e.price, note: e.cap ? `${e.cap - e.going} spots left` : 'No entry limit' }];
function openBooking(eid) {
  const e = EV(eid), tiers = tiersOf(e);
  state.bk = { eid, stage: 'tiers', qty: tiers.map((t, i) => (i === tiers.findIndex(x => !x.out) ? 1 : 0)), app: null, solo: false };
  renderSheet();
}
function bkTotals() {
  const b = state.bk, e = EV(b.eid), tiers = tiersOf(e);
  const sub = tiers.reduce((s, t, i) => s + t.p * b.qty[i], 0);
  const fee = Math.round(sub * 0.04);
  const seats = tiers.reduce((s, t, i) => s + (t.seats || 1) * b.qty[i], 0);
  return { e, tiers, sub, fee, total: sub + fee, seats };
}
function renderSheet() {
  const b = state.bk;
  if (!b) { sheetEl.hidden = true; sheetEl.innerHTML = ''; return; }
  const { e, tiers, sub, fee, total, seats } = bkTotals();
  const club = CLUB(e.club);
  let inner = '';
  if (b.stage === 'tiers') {
    inner = `<div class="sheet-top"><h2>${e.price ? 'Pick your tickets' : 'Confirm your spot'}</h2><button class="icon-btn" data-act="bkclose" aria-label="Close">${ic('close')}</button></div>
      <div class="muted small" style="margin:-8px 0 14px">${e.title} · ${e.date}, ${e.time}</div>
      ${tiers.map((t, i) => `<div class="tier ${t.out ? 'out' : ''}"><div><b>${t.n}</b><span>${money(t.p)} · ${t.note}</span></div>
        ${t.out ? '<span class="status pending">Sold out</span>' : `<div class="stepper"><button data-act="qty" data-id="${i}" data-d="-1" aria-label="Fewer ${t.n}">−</button><output>${b.qty[i]}</output><button data-act="qty" data-id="${i}" data-d="1" aria-label="More ${t.n}">+</button></div>`}</div>`).join('')}
      <label class="check"><input type="checkbox" id="bk-solo" ${b.solo ? 'checked' : ''}> I'm going solo. Introduce me to others going alone.</label>
      ${e.price ? `<div class="sum"><div><span>${seats} ${seats > 1 ? 'entries' : 'entry'}</span><span>${money(sub)}</span></div><div><span>Booking fee (4%)</span><span>${money(fee)}</span></div><div class="tot"><span>Total</span><span>${money(total)}</span></div></div>
      <button class="btn btn-primary block" style="margin-top:16px" data-act="bkpay" ${seats ? '' : 'disabled'}>Pay ${money(total)} with UPI</button>`
      : `<button class="btn btn-primary block" style="margin-top:6px" data-act="bkdone" ${seats ? '' : 'disabled'}>Confirm RSVP${seats > 1 ? ` for ${seats}` : ''}</button>
         <p class="fine">Can't make it? Release your spot so someone on the waitlist gets in.</p>`}`;
  } else if (b.stage === 'upi') {
    const apps = [['Google Pay', 'G', 'var(--sky)'], ['PhonePe', 'Pe', 'var(--grape)'], ['Paytm', 'P', 'var(--sky)'], ['BHIM', 'B', 'var(--tang)']];
    inner = `<div class="sheet-top"><button class="icon-btn" data-act="bkback" aria-label="Back">${ic('back')}</button><h2>Pay ${money(total)}</h2></div>
      <div class="muted small" style="margin:-8px 0 14px">To ${club.name} for ${e.title}</div>
      <div class="upi-list">${apps.map(([n, l, c]) => `<button class="upi" data-act="bkapp" data-id="${n}"><span class="logo" style="--c:${c}">${l}</span><span class="grow">${n}</span>${ic('chev', 18)}</button>`).join('')}
        <button class="upi upi-alt" data-act="bkapp" data-id="your UPI app"><span class="logo" style="--c:var(--sun)">@</span><span class="grow">Enter a UPI ID</span>${ic('chev', 18)}</button>
        <button class="upi upi-alt" data-act="bkapp" data-id="your bank"><span class="logo" style="--c:var(--mint)">₹</span><span class="grow">Card or netbanking</span>${ic('chev', 18)}</button></div>
      <div class="secure">${ic('shield', 16)}<span>Paid through our payment partner. The money goes straight to ${club.name}'s account, and refunds follow their policy.</span></div>`;
  } else {
    inner = `<div class="waiting"><div class="spinner" role="progressbar" aria-label="Waiting for payment"></div><h2 class="h2">Approve ${money(total)} in ${b.app}</h2>
      <p class="muted" style="margin:0">Switch to ${b.app}, enter your UPI PIN and come back. We'll confirm on our own.</p></div>`;
  }
  sheetEl.innerHTML = `<button class="sheet-bg" data-act="bkclose" aria-label="Close" tabindex="-1"></button><div class="sheet" role="dialog" aria-modal="true" aria-label="Booking">${'<div style="display:grid;place-items:center;padding-bottom:4px"><span style="width:44px;height:5px;border-radius:99px;background:var(--hair)"></span></div>'}${inner}</div>`;
  sheetEl.hidden = false;
  renderGuide();
}
function finishBooking() {
  const { e, tiers, seats } = bkTotals(), b = state.bk;
  const label = tiers.map((t, i) => b.qty[i] ? `${t.n}${b.qty[i] > 1 ? ' ×' + b.qty[i] : ''}` : '').filter(Boolean).join(', ');
  const t = { id: 't' + Date.now(), eid: e.id, qty: seats, label, code: code() };
  state.tickets.push(t);
  state.bk = null; renderSheet();
  go('success', { tid: t.id });
  confetti();
}

/* ================= GUIDE ================= */
const GUIDE = [['onboarding', 'Onboarding'], ['home', 'Home feed'], ['map', 'Map view'], ['explore', 'Search & filters'], ['event', 'Event page'], ['booking', 'Booking & UPI'], ['tickets', 'My tickets'], ['club', 'Club page'], ['squad', 'Squad plan'], ['organizer', 'Organizer tools']];
function guideKey() {
  if (state.bk) return 'booking';
  const n = state.route.name;
  return { success: 'tickets', ticket: 'tickets', orgdash: 'organizer', orgcreate: 'organizer', profile: 'profile' }[n] || n;
}
function renderGuide() {
  const k = guideKey();
  $('#guide-list').innerHTML = GUIDE.map(([id, l], i) => `<button class="${k === id ? 'on' : ''}" data-jump="${id}"><span>${String(i + 1).padStart(2, '0')}</span>${l}</button>`).join('');
}
$('#guide-list').addEventListener('click', ev => {
  const b = ev.target.closest('[data-jump]'); if (!b) return;
  state.bk = null; renderSheet();
  const j = b.dataset.jump;
  if (j === 'onboarding') { state.stack = []; state.route = { name: 'onboarding', p: {} }; render(); }
  else if (['home', 'map', 'tickets'].includes(j)) tab(j);
  else if (j === 'explore') { tab('home'); go('explore'); }
  else if (j === 'event') { tab('home'); go('event', { id: 'e3' }); }
  else if (j === 'booking') { tab('home'); go('event', { id: 'e3' }); openBooking('e3'); }
  else if (j === 'club') { tab('home'); go('club', { id: 'pacers' }); }
  else if (j === 'squad') { tab('home'); go('squad'); }
  else if (j === 'organizer') { tab('profile'); go('orgdash'); }
});

/* ================= EVENTS ================= */
const app = $('#app');
app.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'go': go(el.dataset.to); break;
    case 'tab': tab(el.dataset.to); break;
    case 'back': back(); break;
    case 'open': go('event', { id }); break;
    case 'club': state.club.tab = 'upcoming'; go('club', { id }); break;
    case 'toast': toast(el.dataset.msg); break;
    case 'share': toast('Share to WhatsApp, Instagram Story or copy the link. The link opens a web page, so friends don\'t need the app.'); break;
    case 'save': {
      const on = !state.saved.has(id); on ? state.saved.add(id) : state.saved.delete(id);
      toast(on ? 'Saved. We\'ll remind you the day before.' : 'Removed from saved plans.'); render(true); break;
    }
    case 'follow': {
      const on = !state.following.has(id); on ? state.following.add(id) : state.following.delete(id);
      toast(on ? `Following ${CLUB(id).name}. Their new events will show in your feed.` : `Unfollowed ${CLUB(id).name}.`); render(true); break;
    }
    case 'interest': state.interests.has(id) ? state.interests.delete(id) : state.interests.add(id); render(true); break;
    case 'area': state.area = id; render(true); break;
    case 'finish-ob': tab('home'); toast(`Showing plans around ${state.area}.`); break;
    case 'quick': {
      state.ex = freshEx();
      if (['tonight', 'weekend'].includes(id)) state.ex.when = id; else state.ex.flags.add(id);
      go('explore'); break;
    }
    case 'cat': state.ex = freshEx(); state.ex.cat = id; go('explore'); break;
    case 'saved': state.ex = freshEx(); state.ex.flags.add('saved'); go('explore'); break;
    case 'exwhen': state.ex.when = id; render(true); break;
    case 'exflag': state.ex.flags.has(id) ? state.ex.flags.delete(id) : state.ex.flags.add(id); render(true); break;
    case 'excat': state.ex.cat = state.ex.cat === id ? null : id; render(true); break;
    case 'exclear': state.ex = freshEx(); render(true); break;
    case 'mapwhen': state.map.when = id; state.map.sel = null; render(); break;
    case 'pin': state.map.sel = id; render(); break;
    case 'mapclear': state.map.sel = null; render(); break;
    case 'mapsheet': state.map.open = !state.map.open; render(); break;
    case 'book': openBooking(id); break;
    case 'bkclose': state.bk = null; renderSheet(); break;
    case 'qty': {
      const i = +id, d = +el.dataset.d; state.bk.qty[i] = Math.max(0, Math.min(6, state.bk.qty[i] + d)); renderSheet(); break;
    }
    case 'bkpay': state.bk.stage = 'upi'; renderSheet(); break;
    case 'bkback': state.bk.stage = 'tiers'; renderSheet(); break;
    case 'bkapp': state.bk.stage = 'wait'; state.bk.app = id; renderSheet(); setTimeout(() => { if (state.bk && state.bk.stage === 'wait') finishBooking(); }, 1900); break;
    case 'bkdone': finishBooking(); break;
    case 'plan': {
      const s = state.sq;
      if (s.locked) { s.locked = null; s.paid = { you: false, ankit: true, priya: false, soumya: false }; }
      if (!s.options.includes(id)) { s.options.push(id); s.votes[id] = []; if (s.options.length > 4) { const rm = s.options.shift(); if (s.mine === rm) s.mine = null; } }
      s.mine = id;
      go('squad'); toast(`Added ${EV(id).short} to Weekend Gang's poll with your vote.`); break;
    }
    case 'vote': state.sq.mine = state.sq.mine === id ? null : id; render(true); break;
    case 'lock': {
      const s = state.sq, vf = x => (s.votes[x] || []).length + (s.mine === x ? 1 : 0);
      s.locked = s.options.slice().sort((a, b) => vf(b) - vf(a))[0];
      render(); toast('4 seats held. Everyone got a pay link for their share.'); break;
    }
    case 'paymine': {
      const s = state.sq, e = EV(s.locked);
      s.paid.you = true;
      state.tickets.push({ id: 't' + Date.now(), eid: e.id, qty: 1, label: 'Squad booking', code: code() });
      render(true); toast(`Paid your share by UPI. Your ticket for ${e.short} is in My Tickets.`); confetti(); break;
    }
    case 'nudge': toast(`Sent ${FR[id].name} a reminder on WhatsApp with their pay link.`); break;
    case 'clubtab': state.club.tab = id; render(true); break;
    case 'tixtab': state.tix.tab = id; render(); break;
    case 'ticket': go('ticket', { tid: id }); break;
    case 'restart': state.stack = []; state.route = { name: 'onboarding', p: {} }; render(); break;
    case 'exitorg': tab('profile'); break;
    case 'sample': state.org.stage = 'reading'; render(); setTimeout(() => { state.org.stage = 'filled'; if (state.route.name === 'orgcreate') render(); }, 2000); break;
    case 'manual': state.org.stage = 'manual'; render(); break;
    case 'publish': {
      const title = $('#f-title').value.trim(), venue = $('#f-venue').value.trim(), date = $('#f-date').value, time = $('#f-time').value;
      if (!title || !venue || !date || !time) { toast('Add a name, date, start time and venue to publish.'); break; }
      const d = new Date(date + 'T' + time), price = Math.max(0, +$('#f-price').value || 0), cap = +$('#f-cap').value || 100;
      const [hh, mm] = time.split(':').map(Number);
      const id2 = 'n' + Date.now();
      EVENTS.push({ id: id2, title, poster: title.split(':')[0], short: title.split(':')[0], cat: $('#f-cat').value, club: 'pacers', day: 'next',
        date: d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/^(\w+) /, '$1, '),
        time: `${(hh % 12) || 12}:${String(mm).padStart(2, '0')} ${hh < 12 ? 'AM' : 'PM'}`, end: '', hour: hh + mm / 60,
        venue: venue.split(',')[0], area: (venue.split(',')[1] || 'Patia').trim(), dist: 1.1, price, going: 0, cap, friends: [], tags: $('#f-rep').checked ? ['Every Sunday'] : [],
        x: 292, y: 176, pat: 'rings', about: 'Created in the prototype.', good: [] });
      const notify = $('#f-notify').checked;
      state.org.created.unshift(id2); state.org.stage = 'empty';
      state.route = state.stack.pop() || { name: 'orgdash', p: {} }; render();
      toast(notify ? 'Published! 2,140 followers will see it at the top of their feed.' : 'Published. It\'s live on your club page and the map.'); break;
    }
  }
});
app.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
});
app.addEventListener('input', ev => {
  if (ev.target.id === 'ex-q') { state.ex.q = ev.target.value; $('#ex-results').innerHTML = exResults(); }
});
app.addEventListener('change', ev => {
  if (ev.target.id === 'bk-solo' && state.bk) { state.bk.solo = ev.target.checked; if (ev.target.checked) toast('Nice. We\'ll add you to a small group chat with other solo-goers the day before.'); }
});

/* ================= STYLE SWITCH ================= */
const STYLE_NOTES = {
  bold: 'Bright poster colours, ink outlines and sticker shadows. Loud, fun and made for Instagram screenshots.',
  minimal: 'White space, hairlines, soft pastels and one green accent. Calm and premium, so event photos stand out.',
};
function setStyle(s) {
  document.documentElement.dataset.style = s;
  document.querySelectorAll('[data-style-set]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.styleSet === s)));
  $('#style-note').textContent = STYLE_NOTES[s];
}
document.querySelector('.style-switch').addEventListener('click', ev => {
  const b = ev.target.closest('[data-style-set]'); if (!b) return;
  setStyle(b.dataset.styleSet);
  try { history.replaceState(null, '', '#' + b.dataset.styleSet); } catch (e) { location.hash = b.dataset.styleSet; }
});
const styleFromHash = () => setStyle(location.hash === '#minimal' ? 'minimal' : 'bold');
window.addEventListener('hashchange', styleFromHash);
styleFromHash();

render();
</script>
